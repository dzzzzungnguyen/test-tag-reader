# Cấu hình Theta X → v4l2loopback
# Dùng bởi bash (source) và systemd EnvironmentFile (KEY=VALUE, không lồng ${}).
# Chỉnh trước install nếu số node trên máy khác.

# Đã xác nhận trên livo-monitor: loopback đang ở /dev/video1
# (YU12/I420 3840x1920 @ 29.970 fps khi gst_loopback chạy)
THETA_VIDEO_NR=1
THETA_CARD_LABEL=ThetaX

THETA_USB_VID=05ca
# LIVE streaming (UVC H.264) — gst_loopback / udev chỉ nhận PID này
THETA_USB_PID_LIVE=2717
# Camera / MTP mode (KHÔNG stream libuvc) — đã thấy trên livo-monitor khi chưa bật LIVE:
# THETA_USB_PID_CAMERA=0373

THETA_PREFIX=/opt/theta
LIBUVC_THETA_DIR=/opt/theta/libuvc-theta
LIBUVC_THETA_SAMPLE_DIR=/opt/theta/libuvc-theta-sample
GST_LOOPBACK_BIN=/opt/theta/libuvc-theta-sample/gst/gst_loopback

LIBUVC_THETA_REPO=https://github.com/ricohapi/libuvc-theta.git
LIBUVC_THETA_SAMPLE_REPO=https://github.com/ricohapi/libuvc-theta-sample.git

# v4l2loopback upstream. Không dùng gói Ubuntu 0.12.7: không build trên kernel >= 6.18.
# v0.15.4 = commit 0f9ee86760b7f2bea174b7e3e7a1d38845da0ab4
V4L2LOOPBACK_REPO=https://github.com/v4l2loopback/v4l2loopback.git
V4L2LOOPBACK_REF=v0.15.4
V4L2LOOPBACK_VERSION=0.15.4
V4L2LOOPBACK_DIR=/opt/theta/v4l2loopback

THETA_DAEMON=1
